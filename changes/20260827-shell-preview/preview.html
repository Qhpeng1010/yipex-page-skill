<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YiPex 页面 | YiPex</title><style>:root{--yipex-shell-sidebar:200px;--yipex-shell-canvas:#f0f0f0;--yipex-shell-surface:#f0f0f0;--yipex-shell-line:#d9d9d9;--yipex-shell-text:#222;--yipex-shell-muted:rgba(0,0,0,.58);--yipex-shell-brand:#4aa52e;--yipex-shell-radius:10px;--yipex-overlay-padding:24px;--yipex-overlay-divider:#e7e8e8}
*,*::before,*::after{box-sizing:border-box;letter-spacing:0!important}
html,body{height:100%;overflow:hidden}
body{margin:0;min-width:320px;background:var(--yipex-shell-canvas);color:var(--yipex-shell-text);font-family:Roboto,"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:400;line-height:22px;letter-spacing:0;font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.yipex-shell{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--yipex-shell-canvas)}
.yipex-shell-topbar{height:52px;flex:0 0 52px;padding:0 28px 0 32px;border-bottom:1px solid var(--yipex-shell-line);background:var(--yipex-shell-canvas);display:flex;align-items:center;justify-content:space-between;gap:18px}.yipex-shell-topbar-brand{height:100%;display:flex;align-items:center}.yipex-shell-logo{width:85px;height:auto;display:block}.yipex-shell-topbar-actions{display:flex;align-items:center;gap:6px}.yipex-shell-topbar-button{position:relative;height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--yipex-shell-muted);display:inline-flex;align-items:center;gap:7px}.yipex-shell-topbar-button:hover{background:#e7e7e7;color:var(--yipex-shell-text)}.yipex-shell-notification-button{padding-right:10px}.yipex-shell-account{height:40px;padding:0 0 0 12px;border:0;background:transparent;display:flex;align-items:center;gap:10px;color:var(--yipex-shell-text)}.yipex-shell-account:hover{background:#e7e7e7}.yipex-shell-email{font-size:14px}.yipex-shell-avatar{width:34px;height:34px;border-radius:50%;background:#f59c16;color:#fff;display:grid;place-items:center;font-weight:500}.yipex-shell-account>[data-antd-icon]{display:inline-flex;color:var(--yipex-shell-muted)}
.yipex-shell-body{min-height:0;overflow:hidden;flex:1;display:grid;grid-template-columns:var(--yipex-shell-sidebar) minmax(0,1fr)}.yipex-shell-sidebar{min-height:0;padding:12px 10px 12px;background:var(--yipex-shell-surface);border-right:1px solid var(--yipex-shell-line);display:flex;flex-direction:column;z-index:10}.yipex-shell-nav{flex:1;display:grid;align-content:start;gap:6px;border:0;background:transparent}.yipex-shell-nav-item{min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--yipex-shell-muted);display:flex;align-items:center;gap:10px;text-align:left;text-decoration:none;font-size:14px;font-weight:400}.yipex-shell-nav-item:hover{background:#e7e7e7;color:var(--yipex-shell-text)}.yipex-shell-nav-item.active{background:#e3f2df;color:#357d21;font-weight:400}.yipex-shell-nav-item .nav-icon{width:20px;display:inline-flex;align-items:center;justify-content:center}.yipex-shell-sidebar-footer{margin-top:auto;padding-top:12px}.yipex-shell-toggle{width:100%;height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--yipex-shell-muted);display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;font-weight:400}.yipex-shell-toggle:hover{background:#e7e7e7;color:var(--yipex-shell-text)}
.yipex-shell-workspace{min-width:0;min-height:0;padding:12px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;display:flex;flex-direction:column}.yipex-shell-content{width:100%;min-width:0;min-height:0;flex:1 0 auto;padding:24px;background:#fff;border-radius:var(--yipex-shell-radius);overflow:visible}.yipex-shell-footer{flex:0 0 auto;min-height:32px;padding:8px 4px 0;text-align:center}.yipex-shell-copyright{color:var(--yipex-shell-muted);font-size:12px;font-weight:400;line-height:20px}
.yipex-shell.is-collapsed{--yipex-shell-sidebar:72px}
@media(max-width:760px){.yipex-shell-topbar{padding:0 14px}.yipex-shell-topbar-button>span:last-child{display:none}.yipex-shell-topbar-button{padding:0 8px}.yipex-shell-account{padding-left:4px}.yipex-shell-email{display:none}.yipex-shell-body{display:block}.yipex-shell-sidebar{display:none}.yipex-shell-workspace{padding:12px}.yipex-shell-content{padding:24px 16px}.yipex-shell-footer{text-align:center}}

.yipex-shell.is-collapsed .yipex-shell-nav-item .nav-icon,.yipex-shell.is-collapsed .yipex-shell-nav-item .nav-icon span,.yipex-shell.is-collapsed .yipex-shell-toggle>[data-antd-icon],.yipex-shell.is-collapsed .yipex-shell-toggle>[data-antd-icon] span{display:inline-flex}
.yipex-shell-empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center}.yipex-shell-empty-title{margin:0 0 24px;color:var(--yipex-shell-text);font-size:20px;line-height:28px;font-weight:500}.yipex-shell-empty-content{min-height:120px;display:flex;align-items:center;justify-content:center}.yipex-shell-empty-content .ant-empty{margin:0}
.ant-modal:not(.ant-modal-confirm) .ant-modal-content{padding:0;overflow:hidden}.ant-modal:not(.ant-modal-confirm) .ant-modal-header{margin:0;padding:16px 48px 16px 24px;border-bottom:1px solid var(--yipex-overlay-divider)}.ant-modal:not(.ant-modal-confirm) .ant-modal-body{padding:var(--yipex-overlay-padding)}.ant-modal:not(.ant-modal-confirm) .ant-modal-footer{margin:0;padding:16px 24px;border-top:1px solid var(--yipex-overlay-divider)}.ant-modal:not(.ant-modal-confirm) .ant-modal-close{top:12px;inset-inline-end:16px}

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@ant-design/icons@5/dist/index.umd.min.js"></script><script>(() => {
  const shell = document.querySelector('[data-shell="yipex-default"]');
  if (!shell) return;
  const page = shell.querySelector('#yipex-page');
  const navItems = [...shell.querySelectorAll('.yipex-shell-nav-item')];
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
  const initialKey = navItems.find((item) => item.classList.contains('active') || item.getAttribute('aria-current') === 'page')?.dataset.menuKey || '';
  const setActive = (key) => navItems.forEach((item) => {
    const active = item.dataset.menuKey === key;
    item.classList.toggle('active', active);
    if (active) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });
  const renderEmptyState = (item) => {
    if (!page || !item) return;
    page.dataset.shellEmpty = 'true';
    const label = item.getAttribute('title') || item.textContent.trim();
    page.innerHTML = '<div class="yipex-shell-empty" data-shell-empty="true" role="status" aria-live="polite"><h1 class="yipex-shell-empty-title">' + escapeHtml(label) + '</h1><div class="yipex-shell-empty-content" data-shell-empty-mount></div></div>';
    const mount = () => {
      const Empty = window.antd?.Empty;
      const target = page.querySelector('[data-shell-empty-mount]');
      if (!Empty || !target || !window.React || !window.ReactDOM) { window.setTimeout(mount, 16); return; }
      const element = window.React.createElement(Empty, { image: Empty.PRESENTED_IMAGE_SIMPLE, description: '暂无数据' });
      if (window.ReactDOM.createRoot) window.ReactDOM.createRoot(target).render(element);
      else if (window.ReactDOM.render) window.ReactDOM.render(element, target);
    };
    mount();
  };
  shell.querySelectorAll('[data-shell-action="toggle-sidebar"]').forEach((button) => button.addEventListener('click', () => {
    const collapsed = shell.classList.toggle('is-collapsed');
    button.setAttribute('aria-expanded', String(!collapsed));
    button.setAttribute('aria-label', collapsed ? '展开导航' : '收起导航');
    button.setAttribute('title', collapsed ? '展开导航' : '收起导航');
  }));
  navItems.forEach((item) => item.addEventListener('click', (event) => {
    const key = item.dataset.menuKey || '';
    setActive(key);
    if (key === initialKey && page?.dataset.shellEmpty) {
      event.preventDefault();
      window.history.replaceState(null, '', '#' + encodeURIComponent(key));
      window.location.reload();
      return;
    }
    if (key && key !== initialKey) {
      event.preventDefault();
      window.history.replaceState(null, '', '#' + encodeURIComponent(key));
      renderEmptyState(item);
    }
  }));
  shell.querySelectorAll('[data-shell-action]').forEach((button) => {
    if (button.dataset.shellAction === 'toggle-sidebar') return;
    button.addEventListener('click', () => button.dispatchEvent(new CustomEvent('yipex-shell-action', { bubbles: true, detail: { action: button.dataset.shellAction } })));
  });
  const renderIcons = () => {
    const iconLibrary = window.icons;
    if (!iconLibrary || !window.React || !window.ReactDOM) { window.setTimeout(renderIcons, 16); return; }
    shell.querySelectorAll('[data-antd-icon]').forEach((node) => {
      if (node.dataset.iconMounted) return;
      const Icon = iconLibrary[node.dataset.antdIcon];
      if (!Icon) return;
      const element = window.React.createElement(Icon);
      if (window.ReactDOM.createRoot) window.ReactDOM.createRoot(node).render(element);
      else if (window.ReactDOM.render) window.ReactDOM.render(element, node);
      node.dataset.iconMounted = 'true';
    });
  };
  renderIcons();
  document.addEventListener('click', (event) => {
    const link = event.target.closest('.ant-breadcrumb a, .standard-page-breadcrumb a');
    if (!link) return;
    const href = link.getAttribute('href') || '';
    if (!href.startsWith('#')) return;
    event.preventDefault();
    if (window.history.length > 1) window.history.back();
    else window.location.assign(href);
  });
})();
</script></body></html>
